<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input formControlName="nombre"></ion-input>
    </ion-item>
    <ion-item>
      <ion-text color="danger" *ngIf="profileForm.get('nombre')?.touched && profileForm.get('nombre')?.invalid">
        <small>El nombre es obligatorio</small>
      </ion-text>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Apellido</ion-label>
      <ion-input formControlName="apellido"></ion-input>
    </ion-item>
    <ion-item>
      <ion-text color="danger" *ngIf="profileForm.get('apellido')?.touched && profileForm.get('apellido')?.invalid">
        <small>El apellido es obligatorio</small>
      </ion-text>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Correo electrónico</ion-label>
      <ion-input formControlName="correo"></ion-input>
    </ion-item>
    <ion-item>
      <ion-text color="danger" *ngIf="profileForm.get('correo')?.touched && profileForm.get('correo')?.invalid">
        <small>El correo es obligatorio</small>
      </ion-text>
    </ion-item>

    <ion-button expand="block" color="success" type="submit" class="button-custom">
      Enviar
    </ion-button>
  </form>
</ion-content>
